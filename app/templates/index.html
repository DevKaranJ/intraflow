<!DOCTYPE html>
<html>
<head>
    <title>Intraday Strategy Bot</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #333; padding: 12px; text-align: left; }
        th { background-color: #1f1f1f; }
        .long { color: #00ff00; font-weight: bold; }
        .short { color: #ff0000; font-weight: bold; }
        .status { padding: 10px; background-color: #1f1f1f; border-radius: 5px; margin-bottom: 20px; display: inline-block;}
        .connected { color: #00ff00; }
        .disconnected { color: #ff0000; }
    </style>
</head>
<body>
    <h1>Intraday Strategy Signals</h1>
    <div class="status">WebSocket Status: <span id="ws-status" class="disconnected">Disconnected</span></div>

    <table>
        <thead>
            <tr>
                <th>Time</th>
                <th>Stock</th>
                <th>Archetype</th>
                <th>Setup</th>
                <th>Entry Price</th>
                <th>Stop Loss</th>
                <th>Reason</th>
            </tr>
        </thead>
        <tbody id="signals-body">
        </tbody>
    </table>

    <!-- Dummy audio element for notification -->
    <audio id="alertSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

    <script>
        const ws = new WebSocket("ws://" + window.location.host + "/ws");
        const statusSpan = document.getElementById("ws-status");
        const signalsBody = document.getElementById("signals-body");
        const alertSound = document.getElementById("alertSound");

        ws.onopen = function() {
            statusSpan.textContent = "Connected";
            statusSpan.className = "connected";
        };

        ws.onclose = function() {
            statusSpan.textContent = "Disconnected";
            statusSpan.className = "disconnected";
        };

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            const row = document.createElement("tr");

            const setupClass = data.setup.toLowerCase() === 'long' ? 'long' : 'short';

            row.innerHTML = `
                <td>${data.time}</td>
                <td>${data.stock}</td>
                <td>${data.archetype}</td>
                <td class="${setupClass}">${data.setup}</td>
                <td>₹${data.entry_price}</td>
                <td>₹${data.stop_loss}</td>
                <td>${data.reason}</td>
            `;

            signalsBody.insertBefore(row, signalsBody.firstChild);

            // Play sound
            alertSound.play().catch(e => console.log("Audio play prevented by browser policy", e));
        };
    </script>
</body>
</html>
